name: Java
on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'java/src/**'
      - 'java/Dockerfile'
      - 'java/.dockerignore'
      - 'java/docker-compose*.yml'
      - 'java/pom.xml'
      - 'java/mvnw'
      - 'java/.mvn/**'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B compile
